# Configuración del asistente (todo lo que NO es secreto).
#
# - Los secretos (TELEGRAM_BOT_TOKEN y las API keys) van en .env, nunca aquí.
# - Cualquier valor se puede sobrescribir con una variable de entorno con el nombre que
#   aparece en el comentario, por ejemplo RETRIEVAL_TOP_K=6.
# - Las rutas relativas se resuelven respecto a la carpeta de este archivo.
# - Los cambios se aplican al reiniciar el bot; no hay que tocar ni desplegar código.
# - Contrato completo y rangos válidos: specs/contracts/config.md

# ----------------------------------------------------------------------------------------
# Modelo de lenguaje. Para cambiar de proveedor:
#   1. Cambia "provider" (abajo) o define LLM_PROVIDER.
#   2. Ten su API key en .env (LLM_ANTHROPIC_API_KEY, LLM_OPENAI_API_KEY o LLM_GEMINI_API_KEY).
#   3. Verifica:  python -m mesa_ayuda.llm.check
#   4. Reinicia el bot.
# Cada proveedor tiene su sección (anthropic, openai, gemini) con su modelo y sus parámetros,
# así que se puede ir y volver sin reescribir nada. Un parámetro vacío ("") no se envía:
# sirve para modelos que lo rechazan. Desde una variable de entorno, usa "none".
# ----------------------------------------------------------------------------------------
llm:
  # LLM_PROVIDER: anthropic | openai | gemini. Es el único valor que hay que cambiar.
  provider: anthropic
  # LLM_MAX_TOKENS: máximo de tokens de cada respuesta; acota el costo por consulta.
  max_tokens: 600
  # LLM_REWRITE_MAX_TOKENS: máximo de tokens al reformular una pregunta de seguimiento.
  rewrite_max_tokens: 100
  # LLM_TIMEOUT_SECONDS: tiempo total de espera por respuesta, reintentos incluidos.
  timeout_seconds: 30
  # LLM_MAX_RETRIES: reintentos ante errores transitorios (429, 5xx, red).
  max_retries: 2
  # Variables genéricas del enunciado. Vacías = se usa la sección del proveedor activo.
  # Si se definen, reemplazan ese valor del proveedor activo, sea cual sea: al cambiar de
  # proveedor hay que revisarlas.
  # LLM_MODEL: reemplaza el modelo del proveedor activo.
  model: ""
  # LLM_BASE_URL: reemplaza la URL de openai (no aplica a los demás).
  base_url: ""
  # LLM_TEMPERATURE (0-2): reemplaza la temperatura del proveedor activo (anthropic no la usa).
  temperature: ""

anthropic:
  # LLM_ANTHROPIC_MODEL: ID del modelo de Claude.
  model: claude-haiku-5-5
  # LLM_ANTHROPIC_EFFORT: low | medium | high | xhigh | max. "low" evita que el modelo
  # gaste tokens razonando en respuestas cortas. Vacío para modelos que no lo aceptan
  # (Haiku 4.5 y anteriores). Su API ya no acepta temperatura.
  effort: low

openai:
  # LLM_OPENAI_MODEL: ID del modelo (o el nombre que use la API compatible).
  model: gpt-5-mini
  # LLM_OPENAI_BASE_URL: URL de una API compatible (Groq, Ollama, vLLM...); vacío = OpenAI.
  base_url: ""
  # LLM_OPENAI_TEMPERATURE (0-2): vacío para los modelos GPT-5, que solo aceptan la de
  # fábrica; 0.1 para modelos como gpt-4.1 o los de una API compatible.
  temperature: ""
  # LLM_OPENAI_REASONING_EFFORT: minimal | low | medium | high. Vacío para modelos sin
  # razonamiento (gpt-4.1, la mayoría de las APIs compatibles).
  reasoning_effort: low
  # LLM_OPENAI_TOKEN_PARAM: auto | max_tokens | max_completion_tokens. "auto" usa
  # max_completion_tokens con OpenAI y max_tokens con una URL propia.
  token_param: auto

gemini:
  # LLM_GEMINI_MODEL: ID del modelo de Gemini.
  model: gemini-2.5-flash
  # LLM_GEMINI_TEMPERATURE (0-2): baja para respuestas factuales; vacío = la de fábrica.
  temperature: 0.1

embeddings:
  # EMBEDDING_PROVIDER: "local" (modelo descargado una vez, sin API key ni costo).
  provider: local
  # EMBEDDING_MODEL: si cambia, el índice se reconstruye solo.
  model: intfloat/multilingual-e5-small

knowledge_base:
  # KNOWLEDGE_BASE_PATH: carpeta con los documentos (.md, .txt, .pdf, .docx).
  path: ./knowledge_base

chunking:
  # CHUNK_SIZE: tamaño máximo de cada fragmento, en caracteres.
  size: 800
  # CHUNK_OVERLAP: caracteres compartidos entre fragmentos consecutivos (< CHUNK_SIZE).
  overlap: 150

retrieval:
  # RETRIEVAL_TOP_K: fragmentos recuperados por pregunta.
  top_k: 5
  # SIMILARITY_THRESHOLD (0-1): similitud mínima para considerar relevante un fragmento.
  # Si ninguno la alcanza, el bot responde "no encontrado" sin llamar al modelo.
  similarity_threshold: 0.80

prompts:
  # SYSTEM_PROMPT_PATH: reglas del asistente (no van en el código).
  system_prompt_path: ./prompts/system_prompt.md
  # REWRITE_PROMPT_PATH: instrucciones para reformular preguntas de seguimiento.
  rewrite_prompt_path: ./prompts/rewrite_prompt.md

history:
  # HISTORY_LENGTH: mensajes (del usuario y del bot) que se conservan por usuario; 0 = sin historial.
  length: 6

access:
  # ALLOWED_USER_IDS / ADMIN_USER_IDS: IDs numéricos de Telegram. Normalmente se definen en
  # .env (cambian por despliegue); si se definen allí, reemplazan estos valores.
  # Los administradores tienen acceso aunque no estén en allowed_user_ids.
  allowed_user_ids: []
  admin_user_ids: []
  # RATE_LIMIT_PER_MINUTE: mensajes máximos por usuario por minuto.
  rate_limit_per_minute: 10
  # DUPLICATE_WINDOW_SECONDS: el mismo texto repetido por el mismo usuario dentro de
  # estos segundos se responde una sola vez (copias que reenvía el cliente de
  # Telegram o un Enter repetido). 0 = desactivado.
  duplicate_window_seconds: 5
  # Control de costo (RNF-08). Los administradores no tienen tope, pero cuentan en el
  # total; saludos, copias y comandos no cuentan. El día va en REINDEX_TIMEZONE.
  # DAILY_QUESTIONS_PER_USER: preguntas al modelo por usuario por día.
  daily_questions_per_user: 50
  # DAILY_QUESTIONS_TOTAL: preguntas al modelo de todos los usuarios por día.
  daily_questions_total: 300
  # MAX_QUESTION_CHARS: largo máximo de una pregunta; más largas se rechazan.
  max_question_chars: 1000

logging:
  # LOG_LEVEL: DEBUG | INFO | WARNING | ERROR.
  level: INFO
  # LOG_QUESTIONS: registrar el texto de las preguntas en el log (privacidad: false por defecto).
  log_questions: false

storage:
  # DATA_DIR: índice vectorial, manifest y base SQLite. Se regenera; no se versiona.
  data_dir: ./data

reindex:
  # REINDEX_SCHEDULE_TIME: hora diaria de reindexación (HH:MM); vacío = desactivada.
  schedule_time: ""
  # REINDEX_TIMEZONE: zona horaria IANA de la hora anterior.
  timezone: America/Bogota
  # REINDEX_NOTIFY_ADMINS: avisar a los administradores si hubo cambios o errores.
  notify_admins: true

ingest:
  # INJECTION_CHECK: off | warn | quarantine. Revisión de texto que intenta dar
  # instrucciones al asistente dentro de los documentos.
  injection_check: warn

bot:
  # SOURCE_DOWNLOAD: botón para descargar el documento citado.
  source_download: false
