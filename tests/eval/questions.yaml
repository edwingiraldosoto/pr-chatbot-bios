# Conjunto de evaluación (T-38; SC-001 a SC-003, RNF-04).
#
# Se corre con `python -m scripts.evaluate` sobre los 4 documentos de ejemplo más
# tests/fixtures/inyeccion.md (un documento con una instrucción escondida).
#
# Campos:
#   kind: in_scope | follow_up | out_of_scope | injection_message | injection_document
#   question: lo que escribe el usuario.
#   history: preguntas anteriores de la misma conversación (se responden antes, en orden).
#   sources: documentos aceptables como fuente (basta uno).
#   facts: cada elemento es una lista de alternativas; la respuesta debe contener al menos
#          una alternativa de cada elemento. Se compara sin tildes ni mayúsculas.
#   forbid: textos que no pueden aparecer (datos inventados o la instrucción obedecida).

- id: vac_dias
  kind: in_scope
  question: ¿Cuántos días de vacaciones tengo al año?
  expected: "15 días hábiles por año completo de trabajo."
  sources: [politica_vacaciones.md]
  facts: [["15"]]

- id: vac_antiguedad
  kind: in_scope
  question: Llevo 7 años en la empresa, ¿me dan días adicionales de vacaciones?
  expected: "Sí: con más de 5 años, 1 día hábil adicional por año, hasta 20 por periodo."
  sources: [politica_vacaciones.md]
  facts: [["1 dia", "un dia", "1 día adicional"], ["20"]]

- id: vac_anticipacion
  kind: in_scope
  question: ¿Con cuánta anticipación debo pedir las vacaciones?
  expected: "Al menos 15 días calendario antes de la fecha de inicio."
  sources: [politica_vacaciones.md]
  facts: [["15"], ["calendario"]]

- id: vac_colectivas
  kind: in_scope
  question: ¿Cuándo son las vacaciones colectivas?
  expected: "Entre el 24 de diciembre y el 2 de enero; se descuentan del saldo."
  sources: [politica_vacaciones.md]
  facts: [["24 de diciembre"], ["2 de enero"]]

- id: vac_dinero
  kind: in_scope
  question: ¿Puedo cambiar mis vacaciones por dinero?
  expected: "Sí, hasta la mitad de los días de un periodo, con aprobación de Gestión Humana."
  sources: [politica_vacaciones.md]
  facts: [["mitad"]]

- id: reem_alimentacion
  kind: in_scope
  question: ¿Cuál es el tope diario de alimentación en un viaje nacional?
  expected: "Hasta $60.000 por día."
  sources: [reembolso_gastos.pdf]
  facts: [["60.000", "60000", "60 000"]]

- id: reem_plazo
  kind: in_scope
  question: ¿Cuánto tiempo tengo para pedir el reembolso de un gasto?
  expected: "30 días calendario después de la fecha del gasto."
  sources: [reembolso_gastos.pdf]
  facts: [["30"]]

- id: reem_minibar
  kind: in_scope
  question: ¿Me reembolsan lo que consuma del minibar del hotel?
  expected: "No, el minibar no es reembolsable."
  sources: [reembolso_gastos.pdf]
  facts: [["no se reembolsa", "no es reembolsable", "no son reembolsables", "no reembolsable", "no se reembolsan", "no te lo reembolsan", "no te reembolsan", "no lo reembolsan", "no está incluido", "no esta incluido", "excluido", "no puedes"]]
  forbid: ["si se reembolsa", "sí se reembolsa"]

- id: reem_anticipo
  kind: in_scope
  question: ¿Puedo pedir un anticipo para un viaje de 3 días?
  expected: "Sí (viaje de más de 2 días): hasta el 70 % del presupuesto estimado."
  sources: [reembolso_gastos.pdf]
  facts: [["70"]]

- id: ti_horario
  kind: in_scope
  question: ¿En qué horario atiende la mesa de servicio de TI?
  expected: "Lunes a viernes de 7:00 a. m. a 7:00 p. m. y sábados de 8:00 a. m. a 12:00 m."
  sources: [soporte_ti.docx]
  facts: [["7:00", "7 a. m.", "7 a.m."], ["sabado"]]

- id: ti_contrasena
  kind: in_scope
  question: ¿Cómo restablezco mi contraseña?
  expected: "Pasos en clave.grupobios.example con el código de 6 dígitos al celular."
  sources: [soporte_ti.docx]
  facts: [["clave.grupobios"], ["codigo", "6 digitos"]]

- id: ti_p1
  kind: in_scope
  question: ¿En cuánto tiempo responden un caso de prioridad crítica?
  expected: "Primera respuesta en 15 minutos (solución objetivo en 4 horas)."
  sources: [soporte_ti.docx]
  facts: [["15 minutos"]]

- id: rem_dias
  kind: in_scope
  question: ¿Cuántos días puedo trabajar desde casa a la semana?
  expected: "Hasta 2 días por semana; los lunes son presenciales."
  sources: [trabajo_remoto.txt]
  facts: [["2 dias", "dos dias", "2 días"]]

- id: rem_auxilio
  kind: in_scope
  question: ¿Cuánto es el auxilio de conectividad?
  expected: "$85.000 mensuales para quien trabaje en remoto al menos 4 días al mes."
  sources: [trabajo_remoto.txt]
  facts: [["85.000", "85000", "85 000"]]

- id: rem_wifi
  kind: in_scope
  question: ¿Puedo trabajar desde el wifi de un café?
  expected: "Solo con la VPN corporativa; sin VPN no se permiten redes públicas."
  sources: [trabajo_remoto.txt]
  facts: [["vpn"]]

# --- Seguimientos (SC-003) --------------------------------------------------------------

- id: seg_acumular
  kind: follow_up
  history: ["¿Cuántos días de vacaciones tengo al año?"]
  question: ¿Y se pueden acumular?
  expected: "Sí, máximo 2 periodos, registrando el aplazamiento en Mi Nube."
  sources: [politica_vacaciones.md]
  facts: [["2 periodos", "dos periodos"]]

- id: seg_hospedaje
  kind: follow_up
  history: ["¿Cuál es el tope de hospedaje por noche en ciudades principales?"]
  question: ¿y en otros municipios?
  expected: "Hasta $200.000 por noche en otros municipios."
  sources: [reembolso_gastos.pdf]
  facts: [["200.000", "200000", "200 000"]]

- id: seg_portatil
  kind: follow_up
  history: ["¿Cuántos días puedo trabajar en remoto?"]
  question: ¿Y qué hago si se me daña el portátil?
  expected: "Reportarlo a la mesa de servicio de TI como incidente; no repararlo por cuenta propia."
  sources: [trabajo_remoto.txt, soporte_ti.docx]
  facts: [["mesa de servicio"]]

- id: seg_cambio_tema
  kind: follow_up
  history: ["¿Cuántos días de vacaciones tengo al año?"]
  question: ¿Cuánto es el auxilio de conectividad?
  expected: "$85.000 mensuales (sin mezclar con el tema de vacaciones)."
  sources: [trabajo_remoto.txt]
  facts: [["85.000", "85000", "85 000"]]

