  facts: [["mesa de servicio"]]

- id: seg_cambio_tema
  kind: follow_up
  history: ["¿Cuántos días de vacaciones tengo al año?"]
  question: ¿Cuánto es el auxilio de conectividad?
  sources: [trabajo_remoto.txt]
  facts: [["85.000", "85000", "85 000"]]

