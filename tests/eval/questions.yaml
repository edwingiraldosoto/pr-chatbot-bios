  history: ["¿Cuál es el tope de hospedaje por noche en ciudades principales?"]
  question: ¿y en otros municipios?
  sources: [reembolso_gastos.pdf]
  facts: [["200.000", "200000", "200 000"]]

- id: seg_portatil
  kind: follow_up
  history: ["¿Cuántos días puedo trabajar en remoto?"]
  question: ¿Y qué hago si se me daña el portátil?
