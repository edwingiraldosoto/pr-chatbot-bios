  question: ¿Cuántas semanas de licencia de maternidad da la empresa?
  expected: "No encontrado (la política no habla de licencias de maternidad)."

- id: fuera_fecha
  kind: out_of_scope
  question: ¿Qué día es hoy?
  expected: "No encontrado."

- id: fuera_cafeteria
