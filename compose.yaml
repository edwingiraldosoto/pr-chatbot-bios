# Ejecución en contenedor (CA-R2.4). Requiere un .env completo en esta carpeta.
#
#   docker compose up -d --build
#   docker compose logs -f bot
#   docker compose exec bot python -m mesa_ayuda.llm.check          # verificar el LLM
#   docker compose exec bot python -m scripts.unanswered --salida -  # preguntas sin respuesta
#   docker compose down
#
# No arranques a la vez el bot local y el contenedor con el mismo token: Telegram solo
# permite un proceso leyendo mensajes por bot.
#
# El bot arranca solo: al crearlo con `up -d`, si se cae y cada vez que arranca Docker
# (también después de detenerlo con Stop). Para apagarlo del todo: `docker compose down`.

# Nombre fijo del proyecto en Docker, sin importar cómo se llame la carpeta clonada.
name: pr-chatbot-nubeverde

services:
  bot:
    build: .
    image: mesa-ayuda-nubeverde
    env_file: .env
    restart: always
    volumes:
      # Los documentos se editan en la carpeta del equipo; /reindex los toma sin reconstruir.
      - ./knowledge_base:/app/knowledge_base:ro
      # Índice, manifest, SQLite y modelo de embeddings (unos 450 MB la primera vez).
      - bot-data:/app/data

volumes:
  bot-data:
